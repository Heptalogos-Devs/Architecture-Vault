name: Build Nous Wave Target Design

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    name: Build target design with XeLaTeX
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Compile target design
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: docs/Nous-Wave
          texlive_version: "2026"
          os: debian
          latexmk_use_xelatex: true
          args: -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Stage PDF for upload
        shell: bash
        run: |
          mkdir -p dist
          cp tmp/pdfs/target-design/main.pdf dist/Nous_Wave_Target_Design.pdf

      - name: Upload target design PDF
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Nous-Wave-Target-Design-${{ github.sha }}
          path: dist/Nous_Wave_Target_Design.pdf
          if-no-files-found: error
          retention-days: 90

      - name: Update stable target design release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: nous-wave-target-design-latest
          RELEASE_TITLE: Nous Wave Target Design (latest)
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # The stable release tag must identify the commit that produced the asset.
            git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
            git push --force origin "refs/tags/$RELEASE_TAG"
            gh release upload "$RELEASE_TAG" dist/Nous_Wave_Target_Design.pdf \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/Nous_Wave_Target_Design.pdf \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "Nous Wave 目标设计 PDF。该 Release 资产和稳定标签随 main 分支成功构建更新。"
          fi
